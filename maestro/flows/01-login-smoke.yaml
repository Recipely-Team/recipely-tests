# Native smoke test — the login screen renders on a real iOS Simulator /
# Android Emulator. Runs against an installed Recipely build (dev or prod).
#
# appId is overridable so you can point at the dev client (com.recipely.app.dev):
#   APP_ID=com.recipely.app.dev maestro test maestro/flows/01-login-smoke.yaml
appId: ${APP_ID}
env:
  APP_ID: com.recipely.app
tags:
  - ios
  - android
  - smoke
---
- launchApp:
    clearState: true
- runFlow: ../subflows/past-onboarding.yaml
- assertVisible: "Recipely"
- assertVisible: "Sign in to view your recipes."
- assertVisible:
    text: "Email"
- assertVisible:
    text: "Password"
- assertVisible: "Sign in"
- scrollUntilVisible:
    element: "Create account"
    direction: DOWN
- assertVisible: "Create account"
- scrollUntilVisible:
    element: "Continue with Google"
    direction: DOWN
- assertVisible: "Continue with Google"
- scrollUntilVisible:
    element: "Continue without an account"
    direction: DOWN
# Must be tappable, not just present: on small phones it sat under the navigation bar.
- tapOn: "Continue without an account"
- extendedWaitUntil:
    visible: "Recipes"
    timeout: 15000
- takeScreenshot: artifacts/native-login
